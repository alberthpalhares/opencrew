name: CI

# Runs the test suite on every push and pull request against main.
# This is the safety net for src/lib/fsx.js and the init/update commands —
# the code that reads and writes files inside a user's project.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Single verification gate (AGENTS.md rule 7): lint, tests, version-sync, size alert.
      - name: Verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high
