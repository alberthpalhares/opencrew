name: CI

# Runs the test suite on every push and pull request against main.
# This is the safety net for src/lib/fsx.js and the init/update commands —
# the code that reads and writes files inside a user's project.
#
# Also reusable (workflow_call): publish.yml calls this file and only publishes
# after every cell of the matrix and the security audit are green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# The least a test run needs: read the code. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The first entry is the floor of engines.node in package.json — the lowest Node the
        # package promises. tests/release-gate.test.js keeps the two in step.
        node-version: ['20.17.0', '22', '24']
    steps:
      # The Actions are pinned by commit SHA (the tag can be moved by someone else); the comment
      # says the version. .github/dependabot.yml proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # No install scripts: nothing in the dependency tree needs one (the only script of this
      # project, `version`, runs on `npm version`, not on install).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Single verification gate (AGENTS.md rule 7): lint, tests, version-sync, size alert.
      - name: Verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high
