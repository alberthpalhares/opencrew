name: CI

# Runs the test suite on every push and pull request against main.
# This is the safety net for src/lib/fsx.js and the init/update commands —
# the code that reads and writes files inside a user's project.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Verify .opencrew-version matches package.json
        run: node scripts/check-version-sync.js
