name: Publish to npm

# Publishes @aksp/opencrew to npm whenever a `v*` tag is pushed (the actual
# release flow used here: `npm version <bump>` + `git push --tags`).
# Authenticates by OIDC (npm "trusted publisher"): no token is stored. The package's settings on
# npmjs.com name this repository and this file (publish.yml); see CONTRIBUTING.md.
#
# Only `push: tags` is wired up on purpose. If you ever create a GitHub Release
# through the UI by typing a brand-new tag name, GitHub pushes that tag AND
# fires `release: published` in the same action — adding that trigger back
# alongside this one would double-publish and fail with "version already
# exists". Creating a Release for an *already-pushed* tag is safe and won't
# trigger this workflow at all (harmless, just means no separate Release
# entry gets made — create one manually from the tag if you want one).
#
# Nothing is published before the CI matrix (ci.yml: Ubuntu and Windows, the Node
# floor and Node 22, plus the security audit) is green for the same commit.
#
# Running this workflow by hand is a rehearsal by default: `dry_run` is on, and
# the last step becomes `npm publish --dry-run`. Do not rehearse with a
# pre-release tag (v1.2.3-rc.0): it matches `v*` and would be published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearsal: run everything and end with npm publish --dry-run (nothing is published)'
        type: boolean
        default: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables npm provenance
    steps:
      # Pinned by commit SHA; .github/dependabot.yml proposes the updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Tag v1.2.3 must match package.json "version" 1.2.3 (AGENTS.md rule 8).
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The npm trusted publisher needs npm >= 11.5.1 and Node >= 22.14.0; the npm that ships with
      # Node 22 is 10.x. The check fails here, with a clear line, and not halfway through the publish.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Publication environment (npm and Node versions)
        run: node scripts/check-publish-env.js

      # Every run (tag or manual rehearsal): this version must not be on npm yet. Only a 404 counts
      # as "not published"; a network error does not pass in silence.
      - name: Version is not yet on npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if OUT=$(npm view "@aksp/opencrew@$PKG_VERSION" version 2>&1); then
            echo "Esta versão já foi publicada: $PKG_VERSION"
            exit 1
          fi
          echo "$OUT" | grep -q E404 || { echo "Não consegui consultar o npm: $OUT"; exit 1; }
          echo "A versão $PKG_VERSION ainda não está no npm."

      # Same gate as CI and local development (AGENTS.md rule 7).
      - name: Verify
        run: npm run verify

      - name: Sanity check (pack)
        run: npm pack --dry-run

      # Manual run with dry_run on (the default): rehearsal, nothing published. It still runs the
# checks above (tag x version only on a tag; version not on npm; Node and npm versions).
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      # A pushed tag, or a manual run with dry_run switched off. The two conditions are
      # exact opposites: one of the two steps runs, never both.
      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: npm publish --provenance --access public
