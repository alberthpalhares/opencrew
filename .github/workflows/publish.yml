name: Publish to npm

# Publishes @aksp/opencrew to npm whenever you create a GitHub Release.
# Requires an NPM_TOKEN repo secret.
#
# Only one trigger (release: published) on purpose: creating a GitHub Release
# also pushes the matching tag, so a second `push: tags` trigger would fire
# a duplicate publish and fail with "version already exists".
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Sanity check (pack)
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
